name: Check generated pages, charts and stills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-charts.txt
      - run: python3 -m pip install -r requirements-charts.txt
      - run: python3 scripts/generate_cases.py --check
      - run: python3 scripts/generate_statistics.py --check
      - run: python3 scripts/generate_stat_charts.py --check
      - run: python3 scripts/refresh_case_engagement.py --date 2026-09-27 --check --require-complete
      - run: python3 scripts/generate_domain_style_atlas.py --check
      - run: python3 scripts/generate_case_thumbnails.py --check
      - run: python3 scripts/generate_new_case_thumbnails.py --check
      - run: python3 scripts/check_color_modes.py
      - run: python3 scripts/generate_intro_charts.py --check
      - run: python3 scripts/generate_color_charts.py --check
